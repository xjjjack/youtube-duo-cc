<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Duo CC layout test</title>
<link rel="stylesheet" href="/content.css"><style>
body { background: #111; color: white; font: 14px Arial; padding: 24px; }
#movie_player { position: relative; width: min(960px, 100%); aspect-ratio: 16/9; background: linear-gradient(125deg,#27372b,#76644a 50%,#242b2f); overflow: hidden; }
.scene { position: absolute; top: 15%; left: 10%; font-size: 36px; color: #fff9; }
.ytp-right-controls { position: absolute; right: 16px; bottom: 12px; display: flex; gap: 4px; height: 36px; }
.ytp-button { position: relative; border: 0; border-radius: 18px; height: 36px; width: 48px; background: #ffffff16; color: #fff; padding: 4px 8px; line-height: 48px; font: 700 15px Arial; }
.caption-window { position: absolute; bottom: 60px; left: 20%; font-size: 24px; background: #000a; padding: 4px 8px; }
video { width: 100%; height: 100%; }
</style></head><body><p>Local UI fixture — simulated video and captions.</p>
<div id="movie_player"><video></video><div class="scene">A walk through the forest</div>
<div class="ytp-caption-window-container"><div class="caption-window">YouTube’s original caption stays here.</div></div>
<div class="ytp-right-controls"><button class="ytp-button ytp-subtitles-button" aria-label="Switch native CC language in this demo" aria-pressed="true">CC</button><button class="ytp-button" aria-label="YouTube settings">⚙</button></div></div>
<script src="preview.js"></script><script src="/captions.js"></script><script src="/queue.js"></script><script src="/content.js"></script></body></html>
